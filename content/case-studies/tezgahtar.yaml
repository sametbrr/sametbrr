architectureNotes:
  - title:
      tr: İş kuralları tek pakette
      en: Business rules in one package
    body:
      tr: Fiyat, indirim ve fiş hesapları arayüzden bağımsız, test edilmiş bir pakette. Web kasası ve masaüstü aynı kodu çalıştırdığı için hesaplar her yerde birebir aynı.
      en: Pricing, discount and receipt maths live in a tested, UI-free package. The web till and the desktop run the same code, so the numbers match everywhere.
  - title:
      tr: Port ve adaptörlerle donanım
      en: Hardware through ports and adapters
    body:
      tr: Uygulama yazıcıyla doğrudan konuşmuyor, bir arayüzle konuşuyor. Ortama göre Electron, yerel ajan ya da tarayıcı adaptörü devreye giriyor; yeni bir donanım eklemek tek bir adaptör yazmak demek.
      en: The app talks to an interface, not to the printer. Depending on the environment, an Electron, local-agent or browser adapter takes over — supporting new hardware means writing one adapter.
  - title:
      tr: Güvenli veritabanı değişiklikleri
      en: Safe database changes
    body:
      tr: Migration'lar ayrı bir konteynerde, kilit ve yedekle çalışıyor. Yıkıcı bir değişiklik test onayı olmadan canlıya ulaşamıyor.
      en: Migrations run in their own container behind a lock and a backup. A destructive change can't reach production without a test signing off.
  - title:
      tr: Otomatik kalite hattı
      en: An automated quality pipeline
    body:
      tr: Her değişiklik kalite kontrolü, derleme ve test adımlarından geçiyor; test ortamına dağıtım otomatik yapılıyor.
      en: Every change passes quality checks, build and tests, and deploys to the test environment automatically.
