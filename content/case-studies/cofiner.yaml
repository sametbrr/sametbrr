architectureNotes:
  - title:
      tr: Çift girişli defter
      en: Double-entry ledger
    body:
      tr: Bakiyeler saklanmıyor, kayıtlardan hesaplanıyor. Her yevmiye kaydının toplamı ertelenmiş bir veritabanı tetikleyicisiyle sıfıra zorlanıyor; tutarsız bir kayıt veritabanına hiç ulaşamıyor.
      en: Balances aren't stored — they're derived from entries. A deferred database trigger forces every journal entry to balance, so an inconsistent entry never reaches the database.
  - title:
      tr: Tek motor, iki yerde
      en: One engine, two places
    body:
      tr: Finans kuralları tek bir pakette. İstemci aynı paketle anlık önizleme yapıyor, API aynı paketle doğruluyor; iki tarafın farklı sonuç üretmesi mümkün değil.
      en: Finance rules live in a single package. The client previews with it, the API validates with it — the two sides can't disagree.
  - title:
      tr: Çalışma alanı izolasyonu
      en: Workspace isolation
    body:
      tr: Her tablo çalışma alanı kimliği taşıyor; bileşik yabancı anahtarlar farklı çalışma alanlarına ait kayıtların birbirine bağlanmasını veritabanı seviyesinde engelliyor.
      en: Every table carries a workspace id; composite foreign keys stop records from different workspaces being linked, right in the database.
  - title:
      tr: Sınırları zorlanan monorepo
      en: A monorepo with enforced boundaries
    body:
      tr: Nx modül sınırları hangi uygulamanın hangi kütüphaneyi kullanabileceğini lint seviyesinde denetliyor; dört uygulama yedi paylaşılan kütüphane üzerinden kontrollü biçimde kod paylaşıyor.
      en: Nx module boundaries decide at lint time which app may use which library; four apps share code through seven libraries in a controlled way.
