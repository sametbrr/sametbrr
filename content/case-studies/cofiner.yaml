tagline:
  tr: Hesaplar, kartlar, borçlar ve planlar tek ekranda; her rakam çift girişli deftere dayanıyor.
  en: Accounts, cards, debts and plans in one view — every number backed by a double-entry ledger.
pitch:
  tr: "Excel tablolarına veda: hesaplar, kredi kartları, kişiler arası borçlar ve gelecek planları tek ekranda. Her kuruş çift girişli bir deftere işleniyor; rakamlar her zaman tutuyor, hiçbir kayıt kaybolmuyor."
  en: "Goodbye, spreadsheets: accounts, credit cards, money between friends and future plans in one view. Every cent lands in a double-entry ledger, so the numbers always add up and nothing ever goes missing."
overview:
  - tr: Cofiner, bireylerin bütün finansal hayatını tek bir yerde, tutarlı ve izlenebilir biçimde yönetmesi için tasarlanmış bir kişisel finans asistanıdır. Banka hesapları, kredi kartları, kişiler arası borç ve alacaklar, aylık bütçe ve geleceğe dönük planlar aynı ekranda bir araya gelir.
    en: Cofiner is a personal finance assistant designed to let people manage their entire financial life in one place — consistently and traceably. Bank accounts, credit cards, money owed between people, monthly budgets and forward-looking plans come together on a single screen.
  - tr: Ürünün temelinde muhasebe dünyasının en güvenilir yöntemi olan çift girişli kayıt sistemi yatıyor. Her işlem bir yevmiye kaydı olarak deftere yazılır, kaydın toplamı veritabanı seviyesinde sıfıra zorlanır ve hiçbir kayıt silinmez; düzeltmeler iz bırakarak yapılır. Bu sayede kullanıcı gördüğü her rakamın nereden geldiğini sonuna kadar takip edebilir.
    en: "At its core sits the most trusted method in accounting: double-entry bookkeeping. Every transaction is written to the ledger as a journal entry, each entry is forced to balance at the database level, and nothing is ever deleted — corrections leave a trail. Users can trace every number they see back to its source."
  - tr: "Mobil uygulama ana kullanım yüzeyi olarak konumlanırken, masaüstü web uygulaması detaylı analiz ve planlama için kullanılıyor. İki istemci de aynı finans motorunu paylaşıyor: kullanıcı bir kayıt girerken sonucu anında önizliyor, API aynı motorla kaydı doğruluyor. Ürün şu anda erken erişim aşamasında geliştirilmeye devam ediyor."
    en: "The mobile app is the primary surface, while the desktop web app serves deeper analysis and planning. Both clients share the same finance engine: users preview the result as they enter a transaction, and the API validates it with that very engine. The product is in active development, currently in early access."
problem:
  tr: Kişisel finans takibi dağınık Excel tablolarında yürüyordu; kart ekstreleri, kişiler arası borçlar ve gelecek projeksiyonu tutarlı ya da izlenebilir değildi.
  en: Personal finances lived in scattered spreadsheets; card statements, debts between people and projections were neither consistent nor traceable.
solution:
  tr: Kuruş hassasiyetli, saf TypeScript bir finans motoru ve çift girişli bir PostgreSQL defteri. Bu çekirdek tek bir API üzerinden mobil ve web uygulamasına hizmet veriyor; iki istemci de aynı paylaşılan kütüphaneleri kullanıyor.
  en: A cent-precise, pure TypeScript finance engine on a double-entry PostgreSQL ledger, served to the mobile and web apps through one API, with both clients sharing the same libraries.
highlights:
  - tr: "Çift girişli defter: her kaydın toplamı veritabanında sıfıra zorlanıyor, kayıtlar silinmiyor, iz yalnız ekleniyor"
    en: "Double-entry ledger: every entry is forced to balance in the database, nothing is deleted, the trail is append-only"
  - tr: Tek finans motoru istemcide önizleme, API'de doğrulama yapıyor; Excel ile birebir tutarlılık testleri var
    en: One finance engine previews on the client and validates on the API, with Excel-parity tests
  - tr: Çalışma alanı bazlı kiracı izolasyonu ve her istekte bağlam kontrolü
    en: Workspace-based tenant isolation with a context check on every request
  - tr: Nx modül sınırlarıyla korunan 4 uygulama ve 7 paylaşılan kütüphane
    en: 4 apps and 7 shared libraries guarded by Nx module boundaries
parts:
  - name: Cofiner Mobile
    kind: mobile
    note:
      tr: Ana kullanım yüzeyi
      en: The primary surface
    detail:
      tr: Expo ve React Native ile iOS ve Android için tek kod tabanından geliştirilen uygulama. Günlük harcama girişi, bakiye takibi ve hızlı işlemler için tasarlandı.
      en: Built with Expo and React Native for iOS and Android from one codebase, designed for daily expense entry, balance tracking and quick actions.
  - name: Web Uygulaması
    kind: web
    note:
      tr: Masaüstü panel
      en: Desktop dashboard
    detail:
      tr: Next.js ile geliştirilen ve statik olarak dağıtılan panel. Hesaplar, kartlar, borçlar, aylık görünüm ve plan ekranlarıyla detaylı analiz sunuyor.
      en: A Next.js dashboard shipped as a static export, offering deep analysis through accounts, cards, debts, monthly view and planning screens.
  - name: Cofiner API
    kind: api
    note:
      tr: Defter, özetler ve kimlik
      en: Ledger, summaries and auth
    detail:
      tr: Yevmiye kayıtlarını, hesap planını ve özet raporları sunan sürümlü REST API. Her istek çalışma alanı bağlamında doğrulanıyor; kimlik yönetimi Better Auth ile sağlanıyor.
      en: A versioned REST API serving journal entries, the chart of accounts and summary reports. Every request is checked against its workspace; identity is handled by Better Auth.
  - name: cofiner.com
    kind: site
    note:
      tr: Tanıtım ve erken erişim
      en: Marketing and early access
    detail:
      tr: Ürünü tanıtan ve erken erişim listesi toplayan pazarlama sitesi.
      en: The marketing site that presents the product and collects the early-access waitlist.
    url: https://cofiner.com
  - name: finance-core
    kind: library
    note:
      tr: Paylaşılan finans motoru
      en: Shared finance engine
    detail:
      tr: Kuruş hassasiyetinde hesaplama yapan, saf TypeScript ile yazılmış motor. Hem istemcide önizleme hem API'de doğrulama için aynı kod çalışıyor; Excel ile birebir tutarlılık testleriyle korunuyor.
      en: A pure TypeScript engine computing to the cent. The same code previews on the client and validates on the API, guarded by Excel-parity tests.
