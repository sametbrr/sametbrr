features: [Custom CMS, RBAC, Multi-language, Multi-site, SEO (JSON-LD + AMP), WebP pipeline]
stack: [ASP.NET Core, .NET 5, EF Core, SQL Server, Razor MVC, JWT, Swagger, MailKit]
