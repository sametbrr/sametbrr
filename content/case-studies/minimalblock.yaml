architectureNotes:
  - title:
      tr: Ortak servis katmanı
      en: A shared service layer
    body:
      tr: Site, panel ve API aynı servis ve veri katmanını kullanıyor; iş kuralları tek bir yerde tutuluyor.
      en: The site, panel and API use the same service and data layer, keeping business rules in one place.
  - title:
      tr: Rol tabanlı yetki
      en: Role-based authorization
    body:
      tr: Beş ayrı yetki politikası, kimin içerik yazabileceğini, onaylayabileceğini ve yönetebileceğini belirliyor.
      en: Five authorization policies decide who can write, approve and administer content.
  - title:
      tr: Arama motoru için tasarım
      en: Designed for search
    body:
      tr: Yapılandırılmış veri, AMP sayfaları, dinamik site haritası ve WebP görsellerle her yazı arama motorlarında hızlı ve zengin görünüyor.
      en: Structured data, AMP pages, a dynamic sitemap and WebP images make every post fast and rich in search results.
