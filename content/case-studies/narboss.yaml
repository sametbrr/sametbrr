slug: narboss
tier: compact
order: 3
title: NarBoss
client: NarPOS
url: https://boss.narpos.com.tr
status: live
period: { tr: 2024 – Günümüz, en: 2024 – Present }
role: [architecture, development]
tagline:
  tr: Restoran sahipleri için çok şubeli, anlık rapor ve uzaktan onay uygulaması.
  en: Multi-branch, real-time reporting and remote approval app for restaurant owners.
problem:
  tr: NarPOS kullanan işletme sahipleri şubelerindeki satışı, kasayı ve iptal/ikram işlemlerini sahada olmadan takip edemiyordu.
  en: Restaurant owners on NarPOS couldn't follow sales, cash and void/gift actions across their branches without being on site.
solution:
  tr: POS terminallerinden gelen adisyon ve kasa verisini toplayan bir .NET API ile raporları, push bildirimlerini, uzaktan onayları ve merkezi fiyat yönetimini tek yerde sunan Angular + Capacitor mobil uygulama.
  en: A .NET API that ingests tickets and cash data from POS terminals, and an Angular + Capacitor app that brings reports, push notifications, remote approvals and central pricing together.
highlights:
  - tr: Gün sonu, ürün, departman, personel, kurye ve şube karşılaştırması dahil 20 rapor ekranı
    en: 20 report screens, including end of day, product, department, staff, courier and branch comparison
  - tr: POS'tan gelen iptal, ikram ve adisyon iptali talepleri için push bildirimli uzaktan onay
    en: Remote approval over push notifications for void, gift and ticket-cancel requests from the POS
  - tr: Şubelere senkronlanan merkezi menü, porsiyon, KDV şablonu ve toplu fiyat yönetimi
    en: Central menu, portion, VAT template and bulk price management synced to branches
  - tr: POS veri alımında performans ve hata loglama altyapısı, rapor servisinin yeniden düzenlenmesi
    en: Performance and error logging for POS ingest, and a refactor of the report service
parts:
