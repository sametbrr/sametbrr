title: NarCost
client: NarPOS
url: https://cost.narpos.com.tr
status: live
period: { tr: 2025 – Günümüz, en: 2025 – Present }
confidentiality: public
role: [architecture, development, ai]
tagline:
  tr: POS satışlarını reçete ve stokla eşleyip gerçek maliyeti çıkaran envanter platformu.
  en: An inventory platform that matches POS sales to recipes and stock to reveal true cost.
problem:
  tr: Restoran ve gıda işletmeleri stok, reçete, üretim, tedarikçi siparişi ve faturayı ayrı yerlerde tutunca maliyet ve kârlılık görünmez hale geliyor.
  en: When stock, recipes, production, supplier orders and invoices live in separate places, cost and profitability become invisible.
solution:
  tr: Şube ve depo bazlı yetkili çok kiracılı bir .NET API, Angular arayüz; POS satışları eşleştirme ve mutabakat ile içeri alınır, e-fatura ve muhasebe sistemleriyle senkron çalışır. Ağır işler RabbitMQ ve zamanlanmış işlerde.
  en: A multi-tenant .NET API with branch/warehouse-scoped permissions and an Angular UI; POS sales come in with item matching and reconciliation, synced with e-invoice and accounting systems. Heavy work runs on RabbitMQ and scheduled jobs.
highlights:
  - tr: Reçete maliyetlendirme, üretim, kasap ve stok dönüşümü, sayım, min/max stok, kâr-zarar
    en: Recipe costing, production, butcher and stock transformation, cycle counts, min/max stock, P&L
  - tr: Veriban e-fatura, Paraşüt ve Logo entegrasyonları
    en: Veriban e-invoice, Paraşüt and Logo integrations
  - tr: Dead-letter ve retry kuyruklu, circuit breaker korumalı RabbitMQ tüketicileri
    en: RabbitMQ consumers with dead-letter/retry queues and a circuit breaker
  - tr: Claude ve DeepSeek arasında değiştirilebilir AI sağlayıcı katmanı
    en: A pluggable AI provider layer switching between Claude and DeepSeek
