architectureNotes:
  - title:
      tr: Silinmeyen opak kimlikler
      en: Opaque IDs that never die
    body:
      tr: Karekodlar içeriğin kendisine değil, kalıcı bir kimliğe işaret ediyor. İçerik değişse de, taşınsa da kitaptaki kod çalışmaya devam ediyor.
      en: QR codes point to a permanent ID, not to the content itself. Whatever happens to the content, the code in the book keeps working.
  - title:
      tr: Sürümlenen içerik
      en: Versioned content
    body:
      tr: Her içerik değişikliği yeni bir sürüm olarak saklanıyor; karekod başka bir sürüme yeniden bağlanabiliyor ve hatalı bir yayın tek adımda geri alınabiliyor.
      en: Every content change is stored as a new version; a QR code can be rebound to another version and a bad release rolled back in one step.
  - title:
      tr: İmzalı medya bağlantıları
      en: Signed media links
    body:
      tr: Video ve ses dosyaları kısa ömürlü, HMAC ile imzalanmış bağlantılarla sunuluyor; içerik doğrudan kopyalanıp paylaşılamıyor.
      en: Video and audio are served through short-lived, HMAC-signed links, so content can't simply be copied and shared.
  - title:
      tr: Güvenilir ödeme ve dağıtım
      en: Reliable payments and deploys
    body:
      tr: Ödeme olayları transactional outbox ile işleniyor, kaçan bildirimler mutabakat taramasıyla yakalanıyor. Yeni sürüm, veritabanı erişimini doğrulayan sağlık kontrolünü geçmeden trafiğe açılmıyor.
      en: Payment events go through a transactional outbox and missed callbacks are caught by a reconciliation sweep. A new release only takes traffic once a health check confirms database access.
