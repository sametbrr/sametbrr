status: live
period: { tr: 2024 – Günümüz, en: 2024 – Present }
confidentiality: public
role: [architecture, development, pm, ai]
tagline:
  tr: NarPOS'un bulut sürümü; restoranın tüm operasyonunu tek platformda toplayan POS ekosistemi.
  en: NarPOS in the cloud — a POS ecosystem that runs a restaurant's entire operation on one platform.
problem:
  tr: Restoranlar satış, masa, paket servis ve mutfağı tek sistemde yönetmeli; aynı anda yemek platformlarından sipariş almalı, ödeme cihazlarını sürmeli, e-fatura kesmeli ve misafirin QR ile kendi siparişini vermesine izin vermeli.
  en: Restaurants need to run sales, tables, takeaway and kitchen in one system — while pulling orders from delivery marketplaces, driving payment devices, issuing e-invoices and letting guests order by QR.
solution:
  tr: CQRS tabanlı 9 .NET servisi ve tek monorepo'dan beslenen 7 istemci uygulaması (web POS, Android tablet POS, Electron donanım köprüsü, işletme sahibi uygulaması, QR menü, sadakat, rezervasyon). Masa, garson çağrısı ve hesap istekleri SignalR + Redis ile anlık olarak terminallere düşer.
  en: Nine CQRS-based .NET services and seven client apps from one monorepo (web POS, Android tablet POS, Electron hardware bridge, owner app, QR menu, loyalty, reservations). Table, waiter-call and bill requests reach terminals in real time over SignalR + Redis.
highlights:
  - tr: Getir, Trendyol, Yemeksepeti ve Migros sipariş entegrasyonları; kurye atama akışı
    en: Getir, Trendyol, Yemeksepeti and Migros order integrations; courier assignment flow
  - tr: Pavo, Hugin, Beko, Inpos ve PAX/Ingenico ödeme cihazlarına Electron üzerinden köprü
    en: Electron bridge to Pavo, Hugin, Beko, Inpos and PAX/Ingenico payment devices
  - tr: Masadan QR ile sipariş, garson çağırma, hesap isteme ve alerjen bilgisi (qr.narpos.com.tr)
    en: QR table ordering, waiter call, bill request and allergen info (qr.narpos.com.tr)
  - tr: "NarZeka: rapor sorgularının üzerinde function calling ile çalışan, SSE ile akan AI rapor asistanı"
    en: "NarZeka: an AI report assistant using function calling over existing report queries, streamed via SSE"
  - tr: Şirket/şube bazlı çok kiracılı yapı, JWT + refresh token, PIN girişi ve servisler arası rate limit
    en: Company/branch multi-tenancy, JWT + refresh tokens, PIN login and cross-service rate limiting
