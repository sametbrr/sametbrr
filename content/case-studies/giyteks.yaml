architectureNotes:
  - title:
      tr: Build adımı yok
      en: No build step
    body:
      tr: Site saf HTML, CSS ve JavaScript'ten oluşuyor; herhangi bir sunucuda ya da doğrudan dosya olarak açılabiliyor. Bakım için geliştirme ortamı gerekmiyor.
      en: The site is plain HTML, CSS and JavaScript; it runs on any server or straight from disk. No development setup is needed to maintain it.
  - title:
      tr: Yapılandırılmış veri
      en: Structured data
    body:
      tr: Firma, hizmetler, teklif kataloğu ve SSS, arama motorlarının doğrudan okuyabildiği JSON-LD ile tanımlanıyor.
      en: The company, services, offer catalog and FAQ are described in JSON-LD that search engines read directly.
  - title:
      tr: Ölçülebilir dönüşüm
      en: Measurable conversion
    body:
      tr: Teklif, telefon, WhatsApp, harita ve form etkileşimleri ayrı GA4 olayları olarak izleniyor; hangi kanalın iş getirdiği görülebiliyor.
      en: Quote, phone, WhatsApp, map and form interactions are tracked as separate GA4 events, showing which channel brings in business.
