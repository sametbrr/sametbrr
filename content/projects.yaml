# GitHub'daki herkese açık repolar, en yeniden eskiye (oluşturulma tarihi). Profil README reposu (sametbrr) proje sayılmaz.
# Güncellemek için: gh repo list sametbrr --visibility public --json name,createdAt
- name: codeagent-sync
  url: https://github.com/sametbrr/codeagent-sync
  kind: package
  registry: { type: npm, id: codeagent-sync }
  featured: true
  summary:
    tr: "Claude Code ve Codex ayarlarını (skill, MCP, hook) her makinede uçtan uca şifreli olarak aynı tutar."
    en: "Keeps Claude Code and Codex config (skills, MCP servers, hooks) identical on every machine, end-to-end encrypted."
- name: github-manager
  url: https://github.com/sametbrr/github-manager
  kind: plugin
  summary:
    tr: "GitHub hesabını uçtan uca denetleyip düzelten Agent Skills plugin'i — profil, açıklamalar, topic'ler, README'ler ve release workflow'ları."
    en: "Agent Skills plugin that audits and fixes a GitHub account — profile, descriptions, topics, READMEs and release workflows."
- name: crypt-sync
  url: https://github.com/sametbrr/crypt-sync
  kind: package
  registry: { type: npm, id: crypt-sync }
  summary:
    tr: ".env dosyalarını age ile şifreli olarak git'te tutar ve makineler arası senkronlar — npm CLI ve Claude Code / Codex plugin'i."
    en: "Keeps .env files age-encrypted in git and synced across machines — an npm CLI plus a Claude Code and Codex plugin."
- name: skill-hub
  url: https://github.com/sametbrr/skill-hub
  kind: plugin
  featured: true
  summary:
    tr: "Claude Code ve Codex için tüm agent plugin'lerimin tek marketplace'i — bir kez ekle, ismiyle kur."
    en: "One marketplace for all my agent plugins, for Claude Code and Codex — register once, install by name."
- name: look-again
  url: https://github.com/sametbrr/look-again
  kind: plugin
  summary:
    tr: "Konuşmayı kararlar, elenen seçenekler ve son planla birlikte kaydedip Claude Code ya da Codex'te kaldığı yerden sürdüren Agent Skills plugin'i."
    en: "Agent Skills plugin that checkpoints a conversation — decisions, rejected options and the final plan — and resumes it with full context in Claude Code or Codex."
- name: project-radar
  url: https://github.com/sametbrr/project-radar
  kind: plugin
  summary:
    tr: "GitHub trendlerini ve topluluk gündemini tarayıp projeleri 0–100 puanlayan, Türkçe HTML rapor üreten günlük radar."
    en: "A daily radar that scans GitHub trending and community chatter, scores projects 0–100 and renders a Turkish HTML report."
- name: prompt-architect
  url: https://github.com/sametbrr/prompt-architect
  kind: plugin
  summary:
    tr: "Kaba bir fikri, tespit edilen Claude ya da GPT modeline göre ayarlanmış, 12 kalite kapılı uzman prompt'a çevirir."
    en: "Turns a rough idea into an expert prompt tuned to the detected Claude or GPT model, with a 12-gate quality review."
- name: llm-wiki-manager
  url: https://github.com/sametbrr/llm-wiki-manager
  kind: plugin
  featured: true
  summary:
    tr: "Claude Code ve Codex için kalıcı, LLM'in yönettiği markdown wiki — model yazar ve çapraz bağlar, sen kaynak seçersin."
    en: "A persistent LLM-managed markdown wiki for Claude Code and Codex — the model writes and cross-references, you curate sources."
- name: openapi-rest-mcp
  url: https://github.com/sametbrr/openapi-rest-mcp
  kind: mcp
  registry: { type: npm, id: openapi-rest-mcp }
  summary:
    tr: "Herhangi bir OpenAPI/Swagger REST API'yi CRUD, keşif, bulanık arama ve çoklu kimlik doğrulamayla saran MCP server."
    en: "MCP server that wraps any OpenAPI/Swagger REST API with CRUD, discovery, fuzzy search and multi-scheme auth."
- name: AssemblyServiceRegistrar
  url: https://github.com/sametbrr/AssemblyServiceRegistrar
  kind: package
  registry: { type: nuget, id: AssemblyServiceRegistrar }
  summary:
    tr: ".NET'te servisleri marker interface ve attribute ile otomatik kaydeden kütüphane — tüm lifetime'lar ve open generic desteği."
    en: ".NET library that auto-registers services via marker interfaces and attributes — all lifetimes and open generics."
- name: EnvironmentConfigurator
  url: https://github.com/sametbrr/EnvironmentConfigurator
  kind: package
  registry: { type: nuget, id: EnvironmentConfigurator }
  summary:
    tr: "ASP.NET Core için tek çağrıda ortam duyarlı yapılandırma; publish profillerini ve appsettings dosyalarını otomatik oluşturur."
    en: "ASP.NET Core package for single-call, environment-aware config loading with auto-scaffolded publish profiles and appsettings."
