# Dependabot: weekly, grouped version updates (max 5 open PRs per ecosystem).
# Package ecosystems group minor and patch bumps into one PR; majors arrive one per PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  # pnpm project (pnpm-lock.yaml): uses the npm ecosystem. pnpm 12 writes a two-document
  # lockfile, so version updates work but Dependabot alerts/security updates are not raised.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
